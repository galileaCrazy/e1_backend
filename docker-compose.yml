# Orquesta los 3 servicios.
# El orden de arranque es automático: postgres → mi-app (espera healthcheck) → medinflow-ia.

version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: clinica-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-MVPClinica}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - clinica-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-MVPClinica}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mi-app:
    build:
      context: ./mi-app
      dockerfile: Dockerfile
    container_name: clinica-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-MVPClinica}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      FASTAPI_HOST: medinflow-ia
      FASTAPI_PORT: 8001
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - clinica-network

  medinflow-ia:
    build:
      context: ./medinflow-ia
      dockerfile: Dockerfile
    container_name: clinica-ia
    ports:
      - "8001:8001"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      SPRING_BOOT_URL: http://mi-app:8080
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - mi-app
    networks:
      - clinica-network

networks:
  clinica-network:
    driver: bridge

volumes:
  postgres_data:
