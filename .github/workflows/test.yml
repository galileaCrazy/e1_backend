name: Tests CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-java:
    name: Tests Spring Boot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Run tests
        working-directory: mi-app
        run: |
          chmod +x mvnw
          ./mvnw clean test -B

  test-python:
    name: Tests FastAPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r medinflow-ia/requirements.txt
          pip install -r medinflow-ia/requirements-dev.txt

      - name: Run tests
        working-directory: medinflow-ia
        env:
          JWT_SECRET: test-secret-ci
          SPRING_BOOT_URL: http://mock
        run: pytest -v
