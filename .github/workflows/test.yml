name: Tests CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r medinflow-ia/requirements-dev.txt

      - name: Run tests
        working-directory: medinflow-ia
        env:
          JWT_SECRET: test-secret-ci
          SPRING_BOOT_URL: http://mock
        run: pytest -v
