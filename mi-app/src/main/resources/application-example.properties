spring.application.name=mi-app

# ===============================
# Conexión a PostgreSQL
# ===============================
# [OBLIGATORIO] Host de la base de datos.
#   - Local: localhost
#   - Docker: el nombre del servicio (postgres)
#   - Nube: la URL del servidor remoto
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:MVPClinica}

# [OBLIGATORIO] Usuario de PostgreSQL
spring.datasource.username=${DB_USER:postgres}

# [OBLIGATORIO] Contraseña de PostgreSQL — nunca dejar vacía en producción
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway aplica las migraciones SQL automáticamente al iniciar
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# none: Flyway controla el esquema — no usar create/update en producción
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
logging.level.org.flywaydb=DEBUG

# ===============================
# JWT
# ===============================
# [OBLIGATORIO] Clave secreta para firmar los tokens.
#   Requisitos: mínimo 256 bits (32 caracteres). Usar Base64 para mayor seguridad.
#   Generar con: openssl rand -base64 32
jwt.secret=${JWT_SECRET}

# Tiempo de expiración del token en milisegundos (86400000 = 24 horas)
jwt.expiration=86400000

# ===============================
# FastAPI — Microservicio IA
# ===============================
# [OBLIGATORIO en producción] URL del microservicio medinflow-ia.
#   - Local: http://localhost:8001
#   - Docker: http://medinflow-ia:8001  (nombre del servicio en docker-compose)
fastapi.url=${FASTAPI_URL:http://localhost:8001}

# ===============================
# Supabase Storage
# ===============================
# Bucket público "adjuntos" — almacena resultados de estudios de los pacientes.
# Obtener las credenciales en: Project Settings → API → Project API Keys
supabase.url=${SUPABASE_URL:https://TU_PROYECTO.supabase.co}
supabase.service-key=${SUPABASE_SERVICE_KEY:TU_SERVICE_ROLE_KEY_AQUI}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:adjuntos}

# ===============================
# Upload de archivos
# ===============================
app.upload.allowed-extensions=pdf,jpg,jpeg,png,webp
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# Circuit Breaker — FastAPI IA
# ===============================
# Si FastAPI falla 50% de las veces en una ventana de 5 llamadas,
# el circuito se abre y se espera 10s antes de reintentar.
resilience4j.circuitbreaker.instances.fastapi-ia.sliding-window-size=5
resilience4j.circuitbreaker.instances.fastapi-ia.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.fastapi-ia.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.fastapi-ia.permitted-number-of-calls-in-half-open-state=2
