spring.application.name=mi-app
# Conexión a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/MVPClinica
spring.datasource.username=postgres
spring.datasource.password=TU_PASSWORD_AQUI
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
logging.level.org.flywaydb=DEBUG

# JWT
jwt.secret=CLAVE_SECRETA_MINIMO_256_BITS
jwt.expiration=86400000

#FastAPI
fastapi.url=http://localhost:8001

# Circuit Breaker — FastAPI IA
resilience4j.circuitbreaker.instances.fastapi-ia.sliding-window-size=5
resilience4j.circuitbreaker.instances.fastapi-ia.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.fastapi-ia.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.fastapi-ia.permitted-number-of-calls-in-half-open-state=2
